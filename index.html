<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>班级美食地图 - 趣味主题展示站</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#FF6B6B',
            secondary: '#4ECDC4',
            accent: '#FFE66D',
            dark: '#2C3E50',
            light: '#F7F9FC'
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    .hero-gradient {
      background: linear-gradient(135deg, #FF6B6B 0%, #4ECDC4 100%);
    }
    .card-hover {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .card-hover:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.1);
    }
    .scroll-progress {
      position: fixed;
      top: 0;
      left: 0;
      height: 4px;
      background: linear-gradient(90deg, #FF6B6B, #4ECDC4);
      z-index: 9999;
      transition: width 0.1s ease;
    }
    .back-to-top {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, #FF6B6B, #4ECDC4);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
      z-index: 1000;
    }
    .back-to-top.visible {
      opacity: 1;
      visibility: visible;
    }
    .back-to-top:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(255, 107, 107, 0.5);
    }
    .lightbox-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }
    .lightbox-overlay.visible {
      opacity: 1;
      visibility: visible;
    }
    .lightbox-content {
      max-width: 90vw;
      max-height: 90vh;
      position: relative;
    }
    .lightbox-content img {
      max-width: 100%;
      max-height: 85vh;
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }
    .lightbox-caption {
      color: white;
      text-align: center;
      margin-top: 15px;
      font-size: 18px;
      font-weight: 500;
    }
    .lightbox-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 50px;
      height: 50px;
      background: rgba(255, 255, 255, 0.2);
      border: none;
      border-radius: 50%;
      color: white;
      font-size: 24px;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    .lightbox-nav:hover {
      background: rgba(255, 255, 255, 0.3);
    }
    .lightbox-prev { left: 20px; }
    .lightbox-next { right: 20px; }
    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 40px;
      height: 40px;
      background: rgba(255, 255, 255, 0.2);
      border: none;
      border-radius: 50%;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }
    .like-btn.liked {
      color: #FF6B6B;
    }
    .like-btn.liked svg {
      fill: #FF6B6B;
    }
    .star-rating .star {
      cursor: pointer;
      transition: color 0.2s ease, transform 0.2s ease;
    }
    .star-rating .star:hover {
      transform: scale(1.2);
    }
    .star-rating .star.active {
      color: #FFE66D;
    }
    .category-btn.active {
      background: linear-gradient(135deg, #FF6B6B, #4ECDC4);
      color: white;
    }
    .fade-in {
      animation: fadeIn 0.5s ease forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .comment-item {
      animation: slideIn 0.3s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-20px); }
      to { opacity: 1; transform: translateX(0); }
    }
    img[lazy] {
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    img[lazy].loaded {
      opacity: 1;
    }
    .share-toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #2C3E50;
      color: white;
      padding: 12px 24px;
      border-radius: 25px;
      font-size: 14px;
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 10001;
    }
    .share-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body class="bg-light font-sans">
  <div class="scroll-progress" id="scrollProgress"></div>

  <nav class="bg-white shadow-md sticky top-0 z-50">
    <div class="container mx-auto px-4">
      <div class="flex justify-between items-center py-4">
        <a href="index.html" class="text-xl font-bold text-primary">🍜 班级美食地图</a>
        <div class="flex items-center gap-6">
          <a href="#foods" class="text-dark hover:text-primary transition-colors">美食列表</a>
          <a href="#comments" class="text-dark hover:text-primary transition-colors">留言板</a>
          <a href="resume.html" class="bg-gradient-to-r from-primary to-secondary text-white px-4 py-2 rounded-full hover:shadow-lg transition-all">关于站长</a>
        </div>
      </div>
    </div>
  </nav>

  <header class="hero-gradient text-white py-20 md:py-28 relative overflow-hidden">
    <div class="absolute inset-0 opacity-10">
      <div class="absolute top-10 right-20 text-8xl">🍜</div>
      <div class="absolute bottom-10 left-20 text-8xl">🍲</div>
      <div class="absolute top-1/2 left-1/4 text-6xl">🥟</div>
      <div class="absolute top-1/3 right-1/4 text-6xl">🍤</div>
    </div>
    <div class="container mx-auto px-4 text-center relative z-10">
      <h1 class="text-4xl md:text-6xl font-bold mb-6">发现校园周边的宝藏美食</h1>
      <p class="text-lg md:text-xl opacity-90 max-w-2xl mx-auto">
        每一道美食背后都有属于它的故事，让我们一起探索身边的美味
      </p>
    </div>
  </header>

  <main class="container mx-auto px-4 py-16">
    <section id="foods" class="mb-16">
      <div class="flex flex-wrap justify-center gap-3 mb-10">
        <button class="category-btn active px-6 py-2 rounded-full bg-gradient-to-r from-primary to-secondary text-white font-medium hover:shadow-lg transition-all" onclick="filterFoods('all')">
          全部
        </button>
        <button class="category-btn px-6 py-2 rounded-full bg-white text-dark font-medium hover:shadow-lg transition-all" onclick="filterFoods('面条')">
          面条
        </button>
        <button class="category-btn px-6 py-2 rounded-full bg-white text-dark font-medium hover:shadow-lg transition-all" onclick="filterFoods('小吃')">
          小吃
        </button>
        <button class="category-btn px-6 py-2 rounded-full bg-white text-dark font-medium hover:shadow-lg transition-all" onclick="filterFoods('早点')">
          早点
        </button>
        <button class="category-btn px-6 py-2 rounded-full bg-white text-dark font-medium hover:shadow-lg transition-all" onclick="filterFoods('夜宵')">
          夜宵
        </button>
      </div>

      <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8" id="foodContainer">
      </div>
    </section>

    <section id="comments" class="bg-white rounded-2xl shadow-lg p-8">
      <h2 class="text-2xl font-bold text-dark mb-6 flex items-center gap-3">
        <span class="text-3xl">💬</span>
        留言板
      </h2>

      <div class="mb-8">
        <input type="text" id="commentName" placeholder="您的昵称" class="w-full md:w-1/3 px-4 py-3 rounded-xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all mb-4">
        <textarea id="commentText" placeholder="分享您的美食心得..." rows="4" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all"></textarea>
        <button onclick="addComment()" class="mt-4 bg-gradient-to-r from-primary to-secondary text-white px-6 py-2 rounded-full font-medium hover:shadow-lg transition-all">
          发表留言
        </button>
      </div>

      <div id="commentList" class="space-y-4">
      </div>
    </section>
  </main>

  <footer class="bg-dark text-white py-8 mt-10">
    <div class="container mx-auto px-4 text-center">
      <p class="text-sm opacity-80 mb-4">趣味主题展示站 | GitHub Pages 部署 | 2026</p>
      <a href="resume.html" class="inline-flex items-center gap-2 text-primary hover:text-secondary transition-colors">
        <span>👨‍💻</span>
        <span>关于站长</span>
      </a>
    </div>
  </footer>

  <div class="back-to-top" id="backToTop">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
  </div>

  <div class="lightbox-overlay" id="lightbox">
    <button class="lightbox-close" onclick="closeLightbox()">✕</button>
    <button class="lightbox-nav lightbox-prev" onclick="prevImage()">‹</button>
    <button class="lightbox-nav lightbox-next" onclick="nextImage()">›</button>
    <div class="lightbox-content">
      <img id="lightboxImage" src="" alt="">
      <div class="lightbox-caption" id="lightboxCaption"></div>
    </div>
  </div>

  <div class="share-toast" id="shareToast">链接已复制到剪贴板！</div>

  <script>
    const foods = [
      { id: 1, name: '老北京炸酱面', category: '面条', desc: '校门口王大爷的拿手绝活，手工擀面配上秘制肉酱，黄瓜丝萝卜丝铺满碗，一口下去满嘴留香，同学们排队也要吃！', img: 'https://neeko-copilot.bytedance.net/api/text_to_image?prompt=traditional%20chinese%20zhajiang%20noodles%20with%20meat%20sauce%20and%20vegetables%20on%20top%20food%20photography&image_size=landscape_4_3' },
      { id: 2, name: '重庆小面', category: '面条', desc: '后街小巷里的宝藏面馆，红油辣子配上花生碎，麻辣鲜香层次分明。微辣是最后的妥协，吃完额头冒汗直呼过瘾！', img: 'https://neeko-copilot.bytedance.net/api/text_to_image?prompt=chongqing%20spicy%20noodles%20with%20red%20chili%20oil%20and%20peanuts%20food%20photography&image_size=landscape_4_3' },
      { id: 3, name: '广式肠粉', category: '早点', desc: '早餐界的温柔担当，薄如蝉翼的米皮裹着鲜虾牛肉，淋上甜酱油，入口滑嫩鲜美。早八人的续命神器，吃完元气满满！', img: 'https://neeko-copilot.bytedance.net/api/text_to_image?prompt=guangzhou%20steamed%20rice%20rolls%20changfen%20with%20shrimp%20and%20beef%20chinese%20breakfast%20food%20photography&image_size=landscape_4_3' },
      { id: 4, name: '西安肉夹馍', category: '小吃', desc: '白吉馍外酥里嫩，腊汁肉肥而不腻，一口咬下肉汁四溢。老板说这是"中式汉堡"，但比汉堡好吃一百倍！', img: 'https://neeko-copilot.bytedance.net/api/text_to_image?prompt=xian%20roujiamo%20chinese%20hamburger%20with%20braised%20pork%20meat%20food%20photography&image_size=landscape_4_3' },
      { id: 5, name: '长沙臭豆腐', category: '小吃', desc: '闻着臭吃着香的典范，外焦里嫩的黑豆腐配上辣椒萝卜丁，浇上秘制汤汁。第一次吃是挑战，第二次吃是上瘾！', img: 'https://neeko-copilot.bytedance.net/api/text_to_image?prompt=changsha%20stinky%20tofu%20fried%20black%20tofu%20with%20spicy%20sauce%20chinese%20street%20food%20photography&image_size=landscape_4_3' },
      { id: 6, name: '台湾蚵仔煎', category: '夜宵', desc: '夜市人气王，新鲜牡蛎配上鸡蛋地瓜粉，煎得外酥内软，淋上甜辣酱。海的味道、夜市的热闹，全在这口小吃里！', img: 'https://neeko-copilot.bytedance.net/api/text_to_image?prompt=taiwanese%20oyster%20omelet%20fried%20oysters%20with%20egg%20and%20sweet%20sauce%20night%20market%20food%20photography&image_size=landscape_4_3' },
      { id: 7, name: '武汉热干面', category: '面条', desc: '芝麻酱爱好者的天堂，面条筋道有嚼劲，淋上香浓芝麻酱和辣油，拌一拌，香气扑鼻。这是武汉人过早的灵魂！', img: 'https://neeko-copilot.bytedance.net/api/text_to_image?prompt=wuhan%20reganmian%20hot%20dry%20noodles%20with%20sesame%20paste%20and%20scallions%20food%20photography&image_size=landscape_4_3' },
      { id: 8, name: '广东早茶', category: '早点', desc: '一盅两件，精致生活。虾饺、烧麦、凤爪、蛋挞...推车叫卖声是清晨最美的旋律。吃早茶吃的不仅是味道，更是仪式感！', img: 'https://neeko-copilot.bytedance.net/api/text_to_image?prompt=cantonese%20morning%20tea%20dim%20sum%20har%20gaw%20shrimp%20dumplings%20siu%20mai%20food%20photography&image_size=landscape_4_3' },
      { id: 9, name: '四川冒菜', category: '小吃', desc: '一个人的火锅，冒菜！各种蔬菜丸子泡在红油汤底里，麻酱蒜泥香菜标配，越吃越上头，根本停不下来！', img: 'https://neeko-copilot.bytedance.net/api/text_to_image?prompt=sichuan%20maocai%20spicy%20vegetables%20and%20meat%20in%20red%20oil%20soup%20chinese%20food%20photography&image_size=landscape_4_3' },
      { id: 10, name: '山东煎饼', category: '早点', desc: '绿叶棚下的烟火气，纯杂粮面糊摊成薄饼，鸡蛋薄脆是灵魂，甜面酱辣条葱花香菜自由搭配，便宜大碗顶饿一上午！', img: 'https://neeko-copilot.bytedance.net/api/text_to_image?prompt=shandong%20pancake%20jianbing%20with%20egg%20and%20vegetables%20chinese%20street%20food%20photography&image_size=landscape_4_3' },
      { id: 11, name: '广东潮汕牛肉火锅', category: '夜宵', desc: '现切牛肉，部位繁多。匙柄、五花趾、吊龙...涮8秒即食，蘸上沙茶酱，鲜嫩到飞起。吃完感觉灵魂都被涮了一遍！', img: 'https://neeko-copilot.bytedance.net/api/text_to_image?prompt=chaoshan%20beef%20hotpot%20with%20fresh%20sliced%20beef%20chinese%20hot%20pot%20food%20photography&image_size=landscape_4_3' },
      { id: 12, name: '云南过桥米线', category: '面条', desc: '仪式感满分的米线，土鸡熬制的高汤滚烫倒入，依次放入配菜和米线，温度刚好煨熟每一根米线。鲜美无比！', img: 'https://neeko-copilot.bytedance.net/api/text_to_image?prompt=yunnan%20crossing%20bridge%20rice%20noodles%20with%20soup%20and%20fresh%20ingredients%20food%20photography&image_size=landscape_4_3' }
    ];

    let currentLightboxIndex = 0;
    let currentCategory = 'all';
    let lightboxImages = [];

    function getLikes() {
      return JSON.parse(localStorage.getItem('foodLikes') || '{}');
    }

    function setLike(foodId, count) {
      const likes = getLikes();
      likes[foodId] = count;
      localStorage.setItem('foodLikes', JSON.stringify(likes));
    }

    function getRatings() {
      return JSON.parse(localStorage.getItem('foodRatings') || '{}');
    }

    function getFoodRating(foodId) {
      const ratings = getRatings();
      return ratings[foodId] || { total: 0, count: 0 };
    }

    function setFoodRating(foodId, rating) {
      const ratings = getRatings();
      if (!ratings[foodId]) {
        ratings[foodId] = { total: 0, count: 0 };
      }
      ratings[foodId].total += rating;
      ratings[foodId].count += 1;
      localStorage.setItem('foodRatings', JSON.stringify(ratings));
    }

    function getAverageRating(foodId) {
      const rating = getFoodRating(foodId);
      if (rating.count === 0) return 0;
      return (rating.total / rating.count).toFixed(1);
    }

    function renderStars(rating, foodId) {
      const avg = getAverageRating(foodId);
      let stars = '';
      for (let i = 1; i <= 5; i++) {
        const filled = i <= Math.round(avg);
        stars += `<span class="star ${filled ? 'active' : ''}" data-value="${i}" style="color: ${filled ? '#FFE66D' : '#ddd'}">★</span>`;
      }
      return stars + `<span class="text-sm text-gray-500 ml-1">(${avg})</span>`;
    }

    function createFoodCard(food, index) {
      const likes = getLikes();
      const likeCount = likes[food.id] || 0;
      const isLiked = likeCount > 0;

      return `
        <article class="bg-white rounded-xl shadow-md overflow-hidden card-hover fade-in" data-category="${food.category}">
          <div class="relative cursor-pointer" onclick="openLightbox(${index})">
            <img lazy src="${food.img}" alt="${food.name}" class="w-full h-48 object-cover" data-index="${index}">
            <span class="absolute top-3 left-3 bg-white/90 text-primary text-xs px-3 py-1 rounded-full font-medium">${food.category}</span>
          </div>
          <div class="p-6">
            <h3 class="text-xl font-bold text-dark mb-2">${food.name}</h3>
            <p class="text-gray-600 leading-relaxed mb-4">${food.desc}</p>
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2">
                <button class="like-btn ${isLiked ? 'liked' : ''}" onclick="toggleLike(${food.id})">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${isLiked ? '#FF6B6B' : '#ddd'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                </button>
                <span class="text-sm text-gray-500">${likeCount}</span>
              </div>
              <div class="star-rating flex items-center gap-1" data-food-id="${food.id}">
                ${renderStars(null, food.id)}
              </div>
              <button class="share-btn text-gray-400 hover:text-primary transition-colors" onclick="shareFood(${index})">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path></svg>
              </button>
            </div>
          </div>
        </article>
      `;
    }

    function renderFoods() {
      const container = document.getElementById('foodContainer');
      const filteredFoods = currentCategory === 'all' ? foods : foods.filter(f => f.category === currentCategory);
      lightboxImages = filteredFoods.map(f => ({ img: f.img, name: f.name }));
      container.innerHTML = filteredFoods.map((food, index) => createFoodCard(food, index)).join('');
      
      document.querySelectorAll('.star-rating').forEach(el => {
        el.addEventListener('click', function(e) {
          const foodId = parseInt(this.dataset.foodId);
          const star = e.target;
          if (star.classList.contains('star')) {
            const rating = parseInt(star.dataset.value);
            setFoodRating(foodId, rating);
            this.innerHTML = renderStars(rating, foodId);
          }
        });
      });

      lazyLoadImages();
    }

    function filterFoods(category) {
      currentCategory = category;
      document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderFoods();
    }

    function toggleLike(foodId) {
      const likes = getLikes();
      const currentCount = likes[foodId] || 0;
      const newCount = currentCount > 0 ? 0 : 1;
      setLike(foodId, newCount);
      
      const likeBtn = event.target.closest('.like-btn');
      const countSpan = likeBtn.nextElementSibling;
      if (newCount > 0) {
        likeBtn.classList.add('liked');
      } else {
        likeBtn.classList.remove('liked');
      }
      countSpan.textContent = newCount;
    }

    function openLightbox(index) {
      currentLightboxIndex = index;
      const lightbox = document.getElementById('lightbox');
      const image = document.getElementById('lightboxImage');
      const caption = document.getElementById('lightboxCaption');
      
      image.src = lightboxImages[index].img;
      caption.textContent = lightboxImages[index].name;
      lightbox.classList.add('visible');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      const lightbox = document.getElementById('lightbox');
      lightbox.classList.remove('visible');
      document.body.style.overflow = '';
    }

    function prevImage() {
      currentLightboxIndex = (currentLightboxIndex - 1 + lightboxImages.length) % lightboxImages.length;
      updateLightbox();
    }

    function nextImage() {
      currentLightboxIndex = (currentLightboxIndex + 1) % lightboxImages.length;
      updateLightbox();
    }

    function updateLightbox() {
      const image = document.getElementById('lightboxImage');
      const caption = document.getElementById('lightboxCaption');
      image.src = lightboxImages[currentLightboxIndex].img;
      caption.textContent = lightboxImages[currentLightboxIndex].name;
    }

    document.addEventListener('keydown', function(e) {
      const lightbox = document.getElementById('lightbox');
      if (!lightbox.classList.contains('visible')) return;
      
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') prevImage();
      if (e.key === 'ArrowRight') nextImage();
    });

    let touchStartX = 0;
    let touchEndX = 0;
    
    document.getElementById('lightbox').addEventListener('touchstart', function(e) {
      touchStartX = e.changedTouches[0].screenX;
    });
    
    document.getElementById('lightbox').addEventListener('touchend', function(e) {
      touchEndX = e.changedTouches[0].screenX;
      const diff = touchStartX - touchEndX;
      if (Math.abs(diff) > 50) {
        if (diff > 0) {
          nextImage();
        } else {
          prevImage();
        }
      }
    });

    function lazyLoadImages() {
      const lazyImages = document.querySelectorAll('img[lazy]');
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const img = entry.target;
            img.src = img.getAttribute('src');
            img.classList.add('loaded');
            observer.unobserve(img);
          }
        });
      }, { threshold: 0.1 });
      
      lazyImages.forEach(img => observer.observe(img));
    }

    function shareFood(index) {
      const food = lightboxImages[index] || foods[index];
      const shareUrl = window.location.href;
      const shareText = `快来看看「${food.name}」！${shareUrl}`;
      
      if (navigator.share) {
        navigator.share({
          title: food.name,
          text: shareText,
          url: shareUrl
        }).catch(() => {
          copyToClipboard(shareUrl);
        });
      } else {
        copyToClipboard(shareUrl);
      }
    }

    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        showToast();
      }).catch(() => {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showToast();
      });
    }

    function showToast() {
      const toast = document.getElementById('shareToast');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function getComments() {
      return JSON.parse(localStorage.getItem('comments') || '[]');
    }

    function setComments(comments) {
      localStorage.setItem('comments', JSON.stringify(comments));
    }

    function addComment() {
      const name = document.getElementById('commentName').value.trim();
      const text = document.getElementById('commentText').value.trim();
      
      if (!name || !text) {
        alert('请填写昵称和留言内容');
        return;
      }
      
      const comments = getComments();
      comments.unshift({
        id: Date.now(),
        name: name,
        text: text,
        time: new Date().toLocaleString('zh-CN')
      });
      
      if (comments.length > 10) {
        comments.pop();
      }
      
      setComments(comments);
      renderComments();
      
      document.getElementById('commentName').value = '';
      document.getElementById('commentText').value = '';
    }

    function renderComments() {
      const comments = getComments();
      const container = document.getElementById('commentList');
      
      if (comments.length === 0) {
        container.innerHTML = '<p class="text-gray-500 text-center py-8">还没有留言，快来分享你的美食心得吧！</p>';
        return;
      }
      
      container.innerHTML = comments.map(comment => `
        <div class="comment-item p-4 bg-light rounded-xl">
          <div class="flex items-center gap-3 mb-2">
            <div class="w-10 h-10 rounded-full bg-gradient-to-br from-primary to-secondary flex items-center justify-center text-white font-semibold">
              ${comment.name.charAt(0)}
            </div>
            <div>
              <span class="font-medium text-dark">${comment.name}</span>
              <span class="text-sm text-gray-400 ml-3">${comment.time}</span>
            </div>
          </div>
          <p class="text-gray-600">${comment.text}</p>
        </div>
      `).join('');
    }

    window.addEventListener('scroll', () => {
      const scrollTop = document.documentElement.scrollTop || document.body.scrollTop;
      const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      const progress = (scrollTop / scrollHeight) * 100;
      document.getElementById('scrollProgress').style.width = progress + '%';
      
      const backToTop = document.getElementById('backToTop');
      if (scrollTop > 500) {
        backToTop.classList.add('visible');
      } else {
        backToTop.classList.remove('visible');
      }
    });

    document.getElementById('backToTop').addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    document.getElementById('lightbox').addEventListener('click', function(e) {
      if (e.target === this) {
        closeLightbox();
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      renderFoods();
      renderComments();
    });
  </script>
</body>
</html>
