<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>班级美食地图</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#FF6B6B',
            secondary: '#4ECDC4',
            accent: '#FFE66D',
            dark: '#2C3E50',
            light: '#F7F9FC'
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    .card-hover {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .card-hover:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }
    .hero-gradient {
      background: linear-gradient(135deg, #FF6B6B 0%, #4ECDC4 100%);
    }
    .scroll-progress {
      position: fixed;
      top: 0;
      left: 0;
      height: 4px;
      background: linear-gradient(90deg, #FF6B6B, #4ECDC4);
      z-index: 9999;
      transition: width 0.1s ease;
    }
    .back-to-top {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, #FF6B6B, #4ECDC4);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
      z-index: 1000;
    }
    .back-to-top.visible {
      opacity: 1;
      visibility: visible;
    }
    .back-to-top:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(255, 107, 107, 0.5);
    }
    .lightbox {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }
    .lightbox.active {
      opacity: 1;
      visibility: visible;
    }
    .lightbox img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
      border-radius: 8px;
    }
    .lightbox-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 50px;
      height: 50px;
      background: rgba(255, 255, 255, 0.2);
      border: none;
      border-radius: 50%;
      color: white;
      font-size: 24px;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    .lightbox-nav:hover {
      background: rgba(255, 255, 255, 0.3);
    }
    .lightbox-prev { left: 20px; }
    .lightbox-next { right: 20px; }
    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 40px;
      height: 40px;
      background: rgba(255, 255, 255, 0.2);
      border: none;
      border-radius: 50%;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }
    .like-btn.liked {
      color: #FF6B6B;
    }
    .like-btn.liked svg {
      fill: #FF6B6B;
    }
    .star-rating .star {
      cursor: pointer;
      transition: color 0.2s ease, transform 0.2s ease;
    }
    .star-rating .star:hover {
      transform: scale(1.2);
    }
    .star-rating .star.active {
      color: #FFE66D;
    }
    .category-btn.active {
      background: linear-gradient(135deg, #FF6B6B, #4ECDC4);
      color: white;
    }
    .fade-in {
      animation: fadeIn 0.5s ease forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .comment-item {
      animation: slideIn 0.3s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-20px); }
      to { opacity: 1; transform: translateX(0); }
    }
    img[lazy] {
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    img[lazy].loaded {
      opacity: 1;
    }
    .share-toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #2C3E50;
      color: white;
      padding: 12px 24px;
      border-radius: 25px;
      font-size: 14px;
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 10001;
    }
    .share-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body class="bg-light font-sans">
  <div class="scroll-progress" id="scrollProgress"></div>

  <nav class="bg-white shadow-md sticky top-0 z-50">
    <div class="container mx-auto px-4">
      <div class="flex justify-between items-center py-4">
        <a href="index.html" class="text-xl font-bold text-primary">🍜 班级美食地图</a>
        <div class="flex items-center gap-6">
          <a href="#foods" class="text-dark hover:text-primary transition-colors">美食列表</a>
          <a href="#comments" class="text-dark hover:text-primary transition-colors">留言板</a>
          <a href="resume.html" class="bg-gradient-to-r from-primary to-secondary text-white px-4 py-2 rounded-full hover:shadow-lg transition-all">关于站长</a>
        </div>
      </div>
    </div>
  </nav>

  <header class="hero-gradient text-white py-20 md:py-28 relative overflow-hidden">
    <div class="absolute inset-0 opacity-10">
      <div class="absolute top-10 left-10 text-8xl">🍜</div>
      <div class="absolute bottom-10 right-10 text-8xl">🍔</div>
      <div class="absolute top-1/2 left-1/4 text-6xl">🍕</div>
    </div>
    <div class="container mx-auto px-4 text-center relative z-10">
      <h1 class="text-4xl md:text-6xl font-bold mb-4">班级美食地图</h1>
      <p class="text-lg md:text-xl opacity-90 mb-6">发现身边美味 · 分享舌尖故事</p>
      <button id="shareBtn" class="bg-white text-primary px-6 py-3 rounded-full font-semibold hover:shadow-lg transition-all flex items-center gap-2 mx-auto">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        分享给朋友
      </button>
    </div>
  </header>

  <main class="container mx-auto px-4 py-16">
    <section id="foods">
      <div class="text-center mb-12">
        <h2 class="text-3xl font-bold text-dark mb-4">美食列表</h2>
        <p class="text-gray-600">发现校园周边的宝藏美食</p>
      </div>

      <div class="flex flex-wrap justify-center gap-3 mb-10">
        <button class="category-btn active px-5 py-2 rounded-full border-2 border-primary text-primary font-medium transition-all hover:shadow-md" data-category="all">全部</button>
        <button class="category-btn px-5 py-2 rounded-full border-2 border-secondary text-secondary font-medium transition-all hover:shadow-md" data-category="面条">面条</button>
        <button class="category-btn px-5 py-2 rounded-full border-2 border-secondary text-secondary font-medium transition-all hover:shadow-md" data-category="小吃">小吃</button>
        <button class="category-btn px-5 py-2 rounded-full border-2 border-secondary text-secondary font-medium transition-all hover:shadow-md" data-category="早点">早点</button>
        <button class="category-btn px-5 py-2 rounded-full border-2 border-secondary text-secondary font-medium transition-all hover:shadow-md" data-category="夜宵">夜宵</button>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8" id="foodGrid">
      </div>
    </section>

    <section id="comments" class="mt-20">
      <div class="text-center mb-12">
        <h2 class="text-3xl font-bold text-dark mb-4">留言板</h2>
        <p class="text-gray-600">写下你的美食心得或想说的话</p>
      </div>

      <div class="max-w-2xl mx-auto">
        <div class="bg-white rounded-2xl shadow-lg p-6 mb-8">
          <form id="commentForm" class="space-y-4">
            <div>
              <input type="text" id="nicknameInput" placeholder="请输入昵称" maxlength="20" class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
            </div>
            <div>
              <textarea id="commentInput" placeholder="说点什么吧..." rows="4" maxlength="500" class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent resize-none"></textarea>
            </div>
            <button type="submit" class="w-full bg-gradient-to-r from-primary to-secondary text-white py-3 rounded-lg font-semibold hover:shadow-lg transition-all">发布留言</button>
          </form>
        </div>

        <div id="commentsList" class="space-y-4">
        </div>
      </div>
    </section>
  </main>

  <footer class="bg-dark text-white py-8">
    <div class="container mx-auto px-4 text-center">
      <p class="text-sm opacity-80 mb-4">趣味主题展示站 | GitHub Pages 部署 | 2026</p>
      <a href="resume.html" class="inline-flex items-center gap-2 text-primary hover:text-secondary transition-colors">
        <span>👨‍💻</span>
        <span>关于站长</span>
      </a>
    </div>
  </footer>

  <div class="back-to-top" id="backToTop">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
  </div>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightboxClose">✕</button>
    <button class="lightbox-nav lightbox-prev" id="lightboxPrev">❮</button>
    <button class="lightbox-nav lightbox-next" id="lightboxNext">❯</button>
    <img src="" alt="" id="lightboxImg">
  </div>

  <div class="share-toast" id="shareToast">链接已复制到剪贴板！</div>

  <script>
    const foods = [
      { id: 1, name: '老北京炸酱面', category: '面条', desc: '校门口王大爷的拿手绝活，手工擀面配上秘制肉酱，黄瓜丝萝卜丝铺满碗，一口下去满嘴留香，同学们排队也要吃！', img: 'https://picsum.photos/400/300?random=1' },
      { id: 2, name: '重庆小面', category: '面条', desc: '后街小巷里的宝藏面馆，红油辣子配上花生碎，麻辣鲜香层次分明。微辣是最后的妥协，吃完额头冒汗直呼过瘾！', img: 'https://picsum.photos/400/300?random=2' },
      { id: 3, name: '广式肠粉', category: '早点', desc: '早餐界的温柔担当，薄如蝉翼的米皮裹着鲜虾牛肉，淋上甜酱油，入口滑嫩鲜美。早八人的续命神器，吃完元气满满！', img: 'https://picsum.photos/400/300?random=3' },
      { id: 4, name: '西安肉夹馍', category: '小吃', desc: '白吉馍外酥里嫩，腊汁肉肥而不腻，一口咬下肉汁四溢。老板说这是"中式汉堡"，但比汉堡好吃一百倍！', img: 'https://picsum.photos/400/300?random=4' },
      { id: 5, name: '长沙臭豆腐', category: '小吃', desc: '闻着臭吃着香的典范，外焦里嫩的黑豆腐配上辣椒萝卜丁，浇上秘制汤汁。第一次吃是挑战，第二次吃是上瘾！', img: 'https://picsum.photos/400/300?random=5' },
      { id: 6, name: '台湾蚵仔煎', category: '夜宵', desc: '夜市人气王，新鲜牡蛎配上鸡蛋地瓜粉，煎得外酥内软，淋上甜辣酱。海的味道、夜市的热闹，全在这口小吃里！', img: 'https://picsum.photos/400/300?random=6' },
      { id: 7, name: '武汉热干面', category: '面条', desc: '芝麻酱爱好者的天堂，面条筋道有嚼劲，淋上香浓芝麻酱和辣油，拌一拌，香气扑鼻。这是武汉人过早的灵魂！', img: 'https://picsum.photos/400/300?random=7' },
      { id: 8, name: '广东早茶', category: '早点', desc: '一盅两件，精致生活。虾饺、烧麦、凤爪、蛋挞...推车叫卖声是清晨最美的旋律。吃早茶吃的不仅是味道，更是仪式感！', img: 'https://picsum.photos/400/300?random=8' },
      { id: 9, name: '四川冒菜', category: '小吃', desc: '一个人的火锅，冒菜！各种蔬菜丸子泡在红油汤底里，麻酱蒜泥香菜标配，越吃越上头，根本停不下来！', img: 'https://picsum.photos/400/300?random=9' },
      { id: 10, name: '山东煎饼', category: '早点', desc: '绿叶棚下的烟火气，纯杂粮面糊摊成薄饼，鸡蛋薄脆是灵魂，甜面酱辣条葱花香菜自由搭配，便宜大碗顶饿一上午！', img: 'https://picsum.photos/400/300?random=10' },
      { id: 11, name: '广东潮汕牛肉火锅', category: '夜宵', desc: '现切牛肉，部位繁多。匙柄、五花趾、吊龙...涮8秒即食，蘸上沙茶酱，鲜嫩到飞起。吃完感觉灵魂都被涮了一遍！', img: 'https://picsum.photos/400/300?random=11' },
      { id: 12, name: '云南过桥米线', category: '面条', desc: '仪式感满分的米线，土鸡熬制的高汤滚烫倒入，依次放入配菜和米线，温度刚好煨熟每一根米线。鲜美无比！', img: 'https://picsum.photos/400/300?random=12' }
    ];

    let currentLightboxIndex = 0;
    let currentCategory = 'all';
    let lightboxImages = [];

    function getLikes() {
      return JSON.parse(localStorage.getItem('foodLikes') || '{}');
    }

    function setLike(foodId, count) {
      const likes = getLikes();
      likes[foodId] = count;
      localStorage.setItem('foodLikes', JSON.stringify(likes));
    }

    function getRatings() {
      return JSON.parse(localStorage.getItem('foodRatings') || '{}');
    }

    function getFoodRating(foodId) {
      const ratings = getRatings();
      return ratings[foodId] || { total: 0, count: 0 };
    }

    function setFoodRating(foodId, rating) {
      const ratings = getRatings();
      if (!ratings[foodId]) {
        ratings[foodId] = { total: 0, count: 0 };
      }
      ratings[foodId].total += rating;
      ratings[foodId].count += 1;
      localStorage.setItem('foodRatings', JSON.stringify(ratings));
    }

    function getAverageRating(foodId) {
      const rating = getFoodRating(foodId);
      if (rating.count === 0) return 0;
      return (rating.total / rating.count).toFixed(1);
    }

    function renderStars(rating, foodId) {
      const avg = getAverageRating(foodId);
      let stars = '';
      for (let i = 1; i <= 5; i++) {
        const filled = i <= Math.round(avg);
        stars += `<span class="star ${filled ? 'active' : ''}" data-value="${i}" style="color: ${filled ? '#FFE66D' : '#ddd'};">★</span>`;
      }
      return stars + `<span class="text-sm text-gray-500 ml-1">(${avg})</span>`;
    }

    function createFoodCard(food, index) {
      const likes = getLikes();
      const likeCount = likes[food.id] || 0;
      const isLiked = likeCount > 0;

      return `
        <article class="bg-white rounded-xl shadow-md overflow-hidden card-hover fade-in" data-category="${food.category}">
          <div class="relative cursor-pointer" onclick="openLightbox(${index})">
            <img lazy src="${food.img}" alt="${food.name}" class="w-full h-48 object-cover" data-index="${index}">
            <span class="absolute top-3 left-3 bg-white/90 text-primary text-xs px-3 py-1 rounded-full font-medium">${food.category}</span>
          </div>
          <div class="p-6">
            <h3 class="text-xl font-bold text-dark mb-2">${food.name}</h3>
            <p class="text-gray-600 leading-relaxed mb-4">${food.desc}</p>
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2">
                <button class="like-btn ${isLiked ? 'liked' : ''}" onclick="toggleLike(${food.id})">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="${isLiked ? '#FF6B6B' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                </button>
                <span class="text-gray-600 like-count">${likeCount}</span>
              </div>
              <div class="star-rating" onclick="event.stopPropagation()">
                ${renderStars(getAverageRating(food.id), food.id)}
              </div>
            </div>
          </div>
        </article>
      `;
    }

    function renderFoods() {
      const grid = document.getElementById('foodGrid');
      const filteredFoods = currentCategory === 'all'
        ? foods
        : foods.filter(f => f.category === currentCategory);

      grid.innerHTML = filteredFoods.map((food, index) => createFoodCard(food, foods.indexOf(food))).join('');

      lightboxImages = foods.map(f => ({ src: f.img.replace('400/300', '800/600'), name: f.name }));

      observeLazyImages();
    }

    function toggleLike(foodId) {
      const likes = getLikes();
      const currentCount = likes[foodId] || 0;
      const newCount = currentCount > 0 ? 0 : 1;
      setLike(foodId, newCount);
      renderFoods();
    }

    function handleStarClick(foodId, value) {
      setFoodRating(foodId, value);
      renderFoods();
    }

    document.querySelectorAll('.category-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCategory = btn.dataset.category;
        renderFoods();
      });
    });

    document.addEventListener('click', (e) => {
      if (e.target.classList.contains('star')) {
        const card = e.target.closest('article');
        if (card) {
          const index = parseInt(card.querySelector('img').dataset.index);
          handleStarClick(foods[index].id, parseInt(e.target.dataset.value));
        }
      }
    });

    function openLightbox(index) {
      currentLightboxIndex = index;
      const lightbox = document.getElementById('lightbox');
      const img = document.getElementById('lightboxImg');
      img.src = lightboxImages[index].src;
      img.alt = lightboxImages[index].name;
      lightbox.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
      document.body.style.overflow = '';
    }

    function navigateLightbox(direction) {
      currentLightboxIndex = (currentLightboxIndex + direction + lightboxImages.length) % lightboxImages.length;
      document.getElementById('lightboxImg').src = lightboxImages[currentLightboxIndex].src;
      document.getElementById('lightboxImg').alt = lightboxImages[currentLightboxIndex].name;
    }

    document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
    document.getElementById('lightboxPrev').addEventListener('click', () => navigateLightbox(-1));
    document.getElementById('lightboxNext').addEventListener('click', () => navigateLightbox(1));

    document.getElementById('lightbox').addEventListener('click', (e) => {
      if (e.target.id === 'lightbox') closeLightbox();
    });

    let touchStartX = 0;
    document.getElementById('lightbox').addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
    });
    document.getElementById('lightbox').addEventListener('touchend', (e) => {
      const touchEndX = e.changedTouches[0].clientX;
      const diff = touchStartX - touchEndX;
      if (Math.abs(diff) > 50) {
        navigateLightbox(diff > 0 ? 1 : -1);
      }
    });

    document.addEventListener('keydown', (e) => {
      if (!document.getElementById('lightbox').classList.contains('active')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') navigateLightbox(-1);
      if (e.key === 'ArrowRight') navigateLightbox(1);
    });

    function observeLazyImages() {
      const images = document.querySelectorAll('img[lazy]');
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.src = entry.target.dataset.src || entry.target.src;
            entry.target.classList.add('loaded');
            observer.unobserve(entry.target);
          }
        });
      }, { rootMargin: '100px' });
      images.forEach(img => observer.observe(img));
    }

    function getComments() {
      return JSON.parse(localStorage.getItem('foodComments') || '[]');
    }

    function saveComment(comment) {
      const comments = getComments();
      comments.unshift(comment);
      if (comments.length > 10) comments.pop();
      localStorage.setItem('foodComments', JSON.stringify(comments));
    }

    function renderComments() {
      const comments = getComments();
      const list = document.getElementById('commentsList');

      if (comments.length === 0) {
        list.innerHTML = '<p class="text-center text-gray-500 py-8">还没有留言，快来抢沙发吧！</p>';
        return;
      }

      list.innerHTML = comments.map((c, i) => `
        <div class="comment-item bg-white rounded-xl shadow p-5">
          <div class="flex items-center gap-3 mb-3">
            <div class="w-10 h-10 rounded-full bg-gradient-to-br from-primary to-secondary flex items-center justify-center text-white font-bold">
              ${c.nickname.charAt(0).toUpperCase()}
            </div>
            <div>
              <div class="font-semibold text-dark">${escapeHtml(c.nickname)}</div>
              <div class="text-xs text-gray-400">${c.time}</div>
            </div>
          </div>
          <p class="text-gray-600 leading-relaxed">${escapeHtml(c.text)}</p>
        </div>
      `).join('');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    document.getElementById('commentForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const nickname = document.getElementById('nicknameInput').value.trim();
      const text = document.getElementById('commentInput').value.trim();

      if (!nickname || !text) {
        alert('请填写昵称和留言内容');
        return;
      }

      const comment = {
        nickname,
        text,
        time: new Date().toLocaleString('zh-CN')
      };

      saveComment(comment);
      document.getElementById('nicknameInput').value = '';
      document.getElementById('commentInput').value = '';
      renderComments();
    });

    document.getElementById('shareBtn').addEventListener('click', async () => {
      const shareData = {
        title: '班级美食地图',
        text: '发现身边美味，分享舌尖故事！',
        url: window.location.href
      };

      try {
        if (navigator.share && navigator.canShare && navigator.canShare(shareData)) {
          await navigator.share(shareData);
        } else {
          await navigator.clipboard.writeText(window.location.href);
          showShareToast();
        }
      } catch (err) {
        try {
          await navigator.clipboard.writeText(window.location.href);
          showShareToast();
        } catch (e) {
          console.log('分享失败');
        }
      }
    });

    function showShareToast() {
      const toast = document.getElementById('shareToast');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    window.addEventListener('scroll', () => {
      const scrollTop = document.documentElement.scrollTop || document.body.scrollTop;
      const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      const progress = (scrollTop / scrollHeight) * 100;
      document.getElementById('scrollProgress').style.width = progress + '%';

      const backToTop = document.getElementById('backToTop');
      if (scrollTop > 500) {
        backToTop.classList.add('visible');
      } else {
        backToTop.classList.remove('visible');
      }
    });

    document.getElementById('backToTop').addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    document.addEventListener('DOMContentLoaded', () => {
      renderFoods();
      renderComments();

      const cards = document.querySelectorAll('article');
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry, index) => {
          if (entry.isIntersecting) {
            setTimeout(() => {
              entry.target.style.opacity = '1';
              entry.target.style.transform = 'translateY(0)';
            }, index * 50);
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.1 });

      cards.forEach(card => {
        card.style.opacity = '0';
        card.style.transform = 'translateY(20px)';
        card.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
        observer.observe(card);
      });
    });
  </script>
</body>
</html>
