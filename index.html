<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>班级美食地图</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#FF6B6B',
            secondary: '#4ECDC4',
            accent: '#FFE66D',
            dark: '#2C3E50',
            light: '#F7F9FC'
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    .card-hover {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .card-hover:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }
    .hero-gradient {
      background: linear-gradient(135deg, #FF6B6B 0%, #4ECDC4 100%);
    }
    .scroll-progress {
      position: fixed;
      top: 0;
      left: 0;
      height: 4px;
      background: linear-gradient(90deg, #FF6B6B, #4ECDC4);
      z-index: 9999;
      transition: width 0.1s ease;
    }
    .back-to-top {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: linear-gradient(135deg, #FF6B6B, #4ECDC4);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      z-index: 1000;
      box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
    }
    .back-to-top.show {
      opacity: 1;
      visibility: visible;
    }
    .back-to-top:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(255, 107, 107, 0.5);
    }
    .lightbox-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      cursor: pointer;
    }
    .lightbox-overlay.active {
      display: flex;
    }
    .lightbox-content {
      max-width: 90vw;
      max-height: 90vh;
      border-radius: 12px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 30px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .lightbox-close:hover {
      background: rgba(255, 255, 255, 0.3);
    }
    .lightbox-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .lightbox-nav:hover {
      background: rgba(255, 255, 255, 0.3);
    }
    .lightbox-prev {
      left: 20px;
    }
    .lightbox-next {
      right: 20px;
    }
    .share-toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      z-index: 10001;
    }
    .share-toast.show {
      opacity: 1;
      visibility: visible;
    }
    .star-rating {
      display: flex;
      gap: 4px;
    }
    .star {
      font-size: 20px;
      cursor: pointer;
      transition: color 0.2s ease;
    }
    .star:hover,
    .star.active {
      color: #FFD700;
    }
    .like-btn {
      transition: all 0.2s ease;
    }
    .like-btn.liked {
      color: #FF6B6B;
    }
    .card-image {
      object-fit: cover;
    }
    .animate-fade-in {
      animation: fadeIn 0.5s ease-in-out;
    }
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body class="bg-light">
  <div class="scroll-progress" id="scrollProgress"></div>
  
  <nav class="bg-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">
        <div class="flex items-center space-x-2">
          <span class="text-2xl">🍜</span>
          <span class="text-xl font-bold bg-gradient-to-r from-primary to-secondary bg-clip-text text-transparent">班级美食地图</span>
        </div>
        <div class="hidden md:flex space-x-6">
          <a href="#foods" class="text-dark hover:text-primary transition-colors">美食推荐</a>
          <a href="#comments" class="text-dark hover:text-primary transition-colors">留言板</a>
          <a href="resume.html" target="_blank" class="text-dark hover:text-primary transition-colors">个人简历</a>
        </div>
        <button class="md:hidden" id="mobileMenuBtn">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
        </button>
      </div>
    </div>
    <div class="md:hidden hidden" id="mobileMenu">
      <div class="px-4 py-2 space-y-2">
        <a href="#foods" class="block py-2 text-dark hover:text-primary">美食推荐</a>
        <a href="#comments" class="block py-2 text-dark hover:text-primary">留言板</a>
        <a href="resume.html" target="_blank" class="block py-2 text-dark hover:text-primary">个人简历</a>
      </div>
    </div>
  </nav>

  <section class="hero-gradient text-white py-16 md:py-24">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
      <h1 class="text-3xl md:text-5xl font-bold mb-4">发现校园美食</h1>
      <p class="text-lg md:text-xl opacity-90 mb-8">探索同学们最爱的美味，分享你的美食故事</p>
      <div class="flex flex-wrap justify-center gap-4">
        <span class="bg-white/20 backdrop-blur-sm px-4 py-2 rounded-full text-sm">🍜 面条</span>
        <span class="bg-white/20 backdrop-blur-sm px-4 py-2 rounded-full text-sm">🥟 早点</span>
        <span class="bg-white/20 backdrop-blur-sm px-4 py-2 rounded-full text-sm">🍢 小吃</span>
        <span class="bg-white/20 backdrop-blur-sm px-4 py-2 rounded-full text-sm">🌙 夜宵</span>
      </div>
    </div>
  </section>

  <section id="foods" class="py-12 md:py-16">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="text-center mb-10">
        <h2 class="text-2xl md:text-3xl font-bold text-dark mb-3">美食推荐</h2>
        <p class="text-gray-600">精选校园周边人气美食</p>
      </div>
      
      <div class="flex flex-wrap justify-center gap-3 mb-10">
        <button class="category-btn active px-4 py-2 rounded-full bg-primary text-white" data-category="all">全部</button>
        <button class="category-btn px-4 py-2 rounded-full bg-gray-200 text-gray-700 hover:bg-gray-300" data-category="面条">面条</button>
        <button class="category-btn px-4 py-2 rounded-full bg-gray-200 text-gray-700 hover:bg-gray-300" data-category="早点">早点</button>
        <button class="category-btn px-4 py-2 rounded-full bg-gray-200 text-gray-700 hover:bg-gray-300" data-category="小吃">小吃</button>
        <button class="category-btn px-4 py-2 rounded-full bg-gray-200 text-gray-700 hover:bg-gray-300" data-category="夜宵">夜宵</button>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" id="foodGrid">
      </div>
    </div>
  </section>

  <section id="comments" class="py-12 md:py-16 bg-white">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="text-center mb-10">
        <h2 class="text-2xl md:text-3xl font-bold text-dark mb-3">美食留言板</h2>
        <p class="text-gray-600">分享你的美食体验</p>
      </div>

      <div class="bg-light rounded-xl p-6 mb-8">
        <div class="flex flex-col md:flex-row gap-4">
          <input type="text" id="commentName" placeholder="你的昵称" class="flex-1 px-4 py-3 rounded-lg border border-gray-200 focus:outline-none focus:border-primary">
          <input type="text" id="commentContent" placeholder="说说你最喜欢的美食..." class="flex-1 px-4 py-3 rounded-lg border border-gray-200 focus:outline-none focus:border-primary">
          <button id="submitComment" class="px-6 py-3 bg-primary text-white rounded-lg hover:bg-primary/90 transition-colors">发送</button>
        </div>
      </div>

      <div id="commentList" class="space-y-4">
      </div>
    </div>
  </section>

  <footer class="bg-dark text-white py-8">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
      <div class="flex justify-center items-center space-x-2 mb-4">
        <span class="text-2xl">🍜</span>
        <span class="font-bold">班级美食地图</span>
      </div>
      <p class="text-gray-400 text-sm">© 2024 班级美食地图. 分享美食，分享快乐.</p>
    </div>
  </footer>

  <div class="back-to-top" id="backToTop">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path>
    </svg>
  </div>

  <div class="lightbox-overlay" id="lightbox">
    <div class="lightbox-close" id="lightboxClose">×</div>
    <div class="lightbox-nav lightbox-prev" id="lightboxPrev">‹</div>
    <img class="lightbox-content" id="lightboxImage" src="" alt="">
    <div class="lightbox-nav lightbox-next" id="lightboxNext">›</div>
  </div>

  <div class="share-toast" id="shareToast">链接已复制到剪贴板！</div>

  <script>
    const foods = [
      { id: 1, name: '老北京炸酱面', category: '面条', desc: '校门口王大爷的拿手绝活，手工擀面配上秘制肉酱，黄瓜丝萝卜丝铺满碗，一口下去满嘴留香，同学们排队也要吃！', img: 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400&h=300&fit=crop' },
      { id: 2, name: '重庆小面', category: '面条', desc: '后街小巷里的宝藏面馆，红油辣子配上花生碎，麻辣鲜香层次分明。微辣是最后的妥协，吃完额头冒汗直呼过瘾！', img: 'https://images.unsplash.com/photo-1544025162-d76694265947?w=400&h=300&fit=crop' },
      { id: 3, name: '广式肠粉', category: '早点', desc: '早餐界的温柔担当，薄如蝉翼的米皮裹着鲜虾牛肉，淋上甜酱油，入口滑嫩鲜美。早八人的续命神器，吃完元气满满！', img: 'https://images.unsplash.com/photo-1547592166-23ac55094b6d?w=400&h=300&fit=crop' },
      { id: 4, name: '西安肉夹馍', category: '小吃', desc: '白吉馍外酥里嫩，腊汁肉肥而不腻，一口咬下肉汁四溢。老板说这是"中式汉堡"，但比汉堡好吃一百倍！', img: 'https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=400&h=300&fit=crop' },
      { id: 5, name: '长沙臭豆腐', category: '小吃', desc: '闻着臭吃着香的典范，外焦里嫩的黑豆腐配上辣椒萝卜丁，浇上秘制汤汁。第一次吃是挑战，第二次吃是上瘾！', img: 'https://images.unsplash.com/photo-1571091717498-4191e4493940?w=400&h=300&fit=crop' },
      { id: 6, name: '台湾蚵仔煎', category: '夜宵', desc: '夜市人气王，新鲜牡蛎配上鸡蛋地瓜粉，煎得外酥内软，淋上甜辣酱。海的味道、夜市的热闹，全在这口小吃里！', img: 'https://images.unsplash.com/photo-1547592166-eac426403336?w=400&h=300&fit=crop' },
      { id: 7, name: '武汉热干面', category: '面条', desc: '芝麻酱爱好者的天堂，面条筋道有嚼劲，淋上香浓芝麻酱和辣油，拌一拌，香气扑鼻。这是武汉人过早的灵魂！', img: 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400&h=300&fit=crop' },
      { id: 8, name: '广东早茶', category: '早点', desc: '一盅两件，精致生活。虾饺、烧麦、凤爪、蛋挞...推车叫卖声是清晨最美的旋律。吃早茶吃的不仅是味道，更是仪式感！', img: 'https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=400&h=300&fit=crop' },
      { id: 9, name: '四川冒菜', category: '小吃', desc: '一个人的火锅，冒菜！各种蔬菜丸子泡在红油汤底里，麻酱蒜泥香菜标配，越吃越上头，根本停不下来！', img: 'https://images.unsplash.com/photo-1414235077428-338989a2e8c0?w=400&h=300&fit=crop' },
      { id: 10, name: '山东煎饼', category: '早点', desc: '绿叶棚下的烟火气，纯杂粮面糊摊成薄饼，鸡蛋薄脆是灵魂，甜面酱辣条葱花香菜自由搭配，便宜大碗顶饿一上午！', img: 'https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=400&h=300&fit=crop' },
      { id: 11, name: '广东潮汕牛肉火锅', category: '夜宵', desc: '现切牛肉，部位繁多。匙柄、五花趾、吊龙...涮8秒即食，蘸上沙茶酱，鲜嫩到飞起。吃完感觉灵魂都被涮了一遍！', img: 'https://images.unsplash.com/photo-1547592166-eac426403336?w=400&h=300&fit=crop' },
      { id: 12, name: '云南过桥米线', category: '面条', desc: '仪式感满分的米线，土鸡熬制的高汤滚烫倒入，依次放入配菜和米线，温度刚好煨熟每一根米线。鲜美无比！', img: 'https://images.unsplash.com/photo-1547592166-23ac55094b6d?w=400&h=300&fit=crop' }
    ];

    let currentLightboxIndex = 0;
    let currentCategory = 'all';
    let lightboxImages = [];

    function getLikes() {
      return JSON.parse(localStorage.getItem('foodLikes') || '{}');
    }

    function saveLikes(likes) {
      localStorage.setItem('foodLikes', JSON.stringify(likes));
    }

    function getRatings() {
      return JSON.parse(localStorage.getItem('foodRatings') || '{}');
    }

    function saveRatings(ratings) {
      localStorage.setItem('foodRatings', JSON.stringify(ratings));
    }

    function getComments() {
      return JSON.parse(localStorage.getItem('foodComments') || '[]');
    }

    function saveComments(comments) {
      localStorage.setItem('foodComments', JSON.stringify(comments));
    }

    function renderFoods(category = 'all') {
      const grid = document.getElementById('foodGrid');
      grid.innerHTML = '';
      
      const filteredFoods = category === 'all' ? foods : foods.filter(f => f.category === category);
      
      filteredFoods.forEach((food, index) => {
        const likes = getLikes();
        const ratings = getRatings();
        const foodLikes = likes[food.id] || 0;
        const foodRating = ratings[food.id] || 0;
        
        const card = document.createElement('div');
        card.className = 'bg-white rounded-xl shadow-lg overflow-hidden card-hover animate-fade-in';
        card.style.animationDelay = `${index * 0.1}s`;
        card.innerHTML = `
          <div class="relative h-48 cursor-pointer" onclick="openLightbox(${food.id})">
            <img src="${food.img}" alt="${food.name}" class="w-full h-full card-image lazy" loading="lazy">
            <div class="absolute inset-0 bg-gradient-to-t from-black/50 to-transparent opacity-0 hover:opacity-100 transition-opacity"></div>
            <span class="absolute top-3 left-3 bg-primary text-white px-3 py-1 rounded-full text-xs">${food.category}</span>
            <span class="absolute bottom-3 left-3 text-white font-medium opacity-0 hover:opacity-100 transition-opacity">点击查看大图</span>
          </div>
          <div class="p-4">
            <h3 class="text-lg font-bold text-dark mb-2">${food.name}</h3>
            <p class="text-gray-600 text-sm mb-3 line-clamp-2">${food.desc}</p>
            <div class="flex items-center justify-between">
              <div class="star-rating" data-food-id="${food.id}">
                ${[1,2,3,4,5].map(star => `
                  <span class="star ${star <= foodRating ? 'active' : ''}" data-rating="${star}">&#9733;</span>
                `).join('')}
              </div>
              <button class="like-btn flex items-center gap-1 text-gray-500 hover:text-primary transition-colors ${foodLikes > 0 ? 'liked' : ''}" data-food-id="${food.id}">
                <span>${foodLikes > 0 ? '❤️' : '🤍'}</span>
                <span>${foodLikes}</span>
              </button>
            </div>
            <button class="share-btn mt-3 w-full py-2 border border-gray-200 rounded-lg text-gray-600 hover:border-primary hover:text-primary transition-colors flex items-center justify-center gap-2" data-food-name="${food.name}">
              <span>🔗</span>
              <span>分享</span>
            </button>
          </div>
        `;
        grid.appendChild(card);
      });
      
      lightboxImages = filteredFoods.map(f => ({ url: f.img, name: f.name }));
      
      bindEvents();
    }

    function bindEvents() {
      document.querySelectorAll('.like-btn').forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const foodId = parseInt(this.dataset.foodId);
          const likes = getLikes();
          if (likes[foodId]) {
            likes[foodId]++;
          } else {
            likes[foodId] = 1;
          }
          saveLikes(likes);
          this.classList.add('liked');
          this.innerHTML = `<span>❤️</span><span>${likes[foodId]}</span>`;
        });
      });

      document.querySelectorAll('.star-rating .star').forEach(star => {
        star.addEventListener('click', function() {
          const foodId = parseInt(this.parentElement.dataset.foodId);
          const rating = parseInt(this.dataset.rating);
          const ratings = getRatings();
          ratings[foodId] = rating;
          saveRatings(ratings);
          
          this.parentElement.querySelectorAll('.star').forEach((s, i) => {
            s.classList.toggle('active', i < rating);
          });
        });
      });

      document.querySelectorAll('.share-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          const foodName = this.dataset.foodName;
          const shareText = `推荐美食：${foodName} - 来自班级美食地图`;
          
          if (navigator.share) {
            navigator.share({
              title: foodName,
              text: shareText,
              url: window.location.href
            });
          } else {
            navigator.clipboard.writeText(`${shareText} ${window.location.href}`).then(() => {
              showToast();
            });
          }
        });
      });
    }

    function openLightbox(foodId) {
      const food = foods.find(f => f.id === foodId);
      if (food) {
        currentLightboxIndex = lightboxImages.findIndex(img => img.url === food.img);
        const lightbox = document.getElementById('lightbox');
        const lightboxImage = document.getElementById('lightboxImage');
        lightboxImage.src = food.img;
        lightboxImage.alt = food.name;
        lightbox.classList.add('active');
        document.body.style.overflow = 'hidden';
      }
    }

    function closeLightbox() {
      const lightbox = document.getElementById('lightbox');
      lightbox.classList.remove('active');
      document.body.style.overflow = '';
    }

    function prevImage() {
      currentLightboxIndex = (currentLightboxIndex - 1 + lightboxImages.length) % lightboxImages.length;
      updateLightbox();
    }

    function nextImage() {
      currentLightboxIndex = (currentLightboxIndex + 1) % lightboxImages.length;
      updateLightbox();
    }

    function updateLightbox() {
      const lightboxImage = document.getElementById('lightboxImage');
      lightboxImage.src = lightboxImages[currentLightboxIndex].url;
      lightboxImage.alt = lightboxImages[currentLightboxIndex].name;
    }

    function showToast() {
      const toast = document.getElementById('shareToast');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function renderComments() {
      const commentList = document.getElementById('commentList');
      const comments = getComments();
      
      if (comments.length === 0) {
        commentList.innerHTML = '<p class="text-center text-gray-400 py-8">暂无留言，快来发表第一条吧！</p>';
        return;
      }
      
      commentList.innerHTML = comments.map((comment, index) => `
        <div class="bg-light rounded-xl p-4 animate-fade-in" style="animation-delay: ${index * 0.05}s">
          <div class="flex items-center gap-3 mb-2">
            <div class="w-8 h-8 rounded-full bg-gradient-to-r from-primary to-secondary flex items-center justify-center text-white text-sm font-bold">${comment.name.charAt(0)}</div>
            <span class="font-medium text-dark">${comment.name}</span>
            <span class="text-gray-400 text-xs">${comment.time}</span>
          </div>
          <p class="text-gray-600">${comment.content}</p>
        </div>
      `).join('');
    }

    function submitComment() {
      const name = document.getElementById('commentName').value.trim();
      const content = document.getElementById('commentContent').value.trim();
      
      if (!name || !content) {
        alert('请填写昵称和留言内容');
        return;
      }
      
      const comments = getComments();
      comments.push({
        id: Date.now(),
        name: name,
        content: content,
        time: new Date().toLocaleString('zh-CN')
      });
      saveComments(comments);
      
      document.getElementById('commentName').value = '';
      document.getElementById('commentContent').value = '';
      renderComments();
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderFoods();
      renderComments();

      document.querySelectorAll('.category-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active', 'bg-primary', 'text-white'));
          document.querySelectorAll('.category-btn').forEach(b => b.classList.add('bg-gray-200', 'text-gray-700'));
          this.classList.add('active', 'bg-primary', 'text-white');
          this.classList.remove('bg-gray-200', 'text-gray-700');
          currentCategory = this.dataset.category;
          renderFoods(currentCategory);
        });
      });

      document.getElementById('mobileMenuBtn').addEventListener('click', () => {
        document.getElementById('mobileMenu').classList.toggle('hidden');
      });

      document.getElementById('submitComment').addEventListener('click', submitComment);

      document.getElementById('commentContent').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          submitComment();
        }
      });

      document.getElementById('lightbox').addEventListener('click', (e) => {
        if (e.target === document.getElementById('lightbox')) {
          closeLightbox();
        }
      });

      document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
      document.getElementById('lightboxPrev').addEventListener('click', (e) => {
        e.stopPropagation();
        prevImage();
      });
      document.getElementById('lightboxNext').addEventListener('click', (e) => {
        e.stopPropagation();
        nextImage();
      });

      document.addEventListener('keydown', (e) => {
        if (document.getElementById('lightbox').classList.contains('active')) {
          if (e.key === 'Escape') closeLightbox();
          if (e.key === 'ArrowLeft') prevImage();
          if (e.key === 'ArrowRight') nextImage();
        }
      });

      const backToTop = document.getElementById('backToTop');
      const scrollProgress = document.getElementById('scrollProgress');

      window.addEventListener('scroll', () => {
        const scrollTop = window.scrollY;
        const docHeight = document.documentElement.scrollHeight - window.innerHeight;
        const scrollPercent = (scrollTop / docHeight) * 100;
        scrollProgress.style.width = `${scrollPercent}%`;
        
        if (scrollTop > 300) {
          backToTop.classList.add('show');
        } else {
          backToTop.classList.remove('show');
        }
      });

      backToTop.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });
  </script>
</html>
